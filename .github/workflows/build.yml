name: Build

permissions:
  contents: read

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  schedule:
    # Weekly rebuild to pick up Debian and PHP security updates
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: single-user
            flavor: latest=auto
          - target: http-user
            flavor: suffix=-http-user,onlatest=true
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read # to fetch the repository content
      id-token: write # for signing attestations and cache entries with GitHub OIDC
      packages: write # to push to ghcr.io
    with:
      output: image
      target: ${{ matrix.target }}
      push: ${{ github.event_name != 'pull_request' }}
      platforms: linux/amd64,linux/arm64
      cache: true
      sbom: true
      set-meta-labels: true
      meta-images: ghcr.io/shopwarelabs/shopware-webspace-emulator
      meta-flavor: ${{ matrix.flavor }}
      meta-tags: |
        type=raw,value=latest,enable={{is_default_branch}}
        type=ref,event=pr
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=sha
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
